name: Patch hero kicker spacing

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply minimal homepage spacing patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          old = '<div class="kicker">Formazione funeraria</div>'
          new = '<div class="kicker hero-kicker">Formazione funeraria</div>'
          html = html.replace(old, new, 1)

          css = '''\n  .hero-kicker{\n    margin-top: 18px !important;\n  }\n'''
          if '.hero-kicker{' not in html:
              marker = '</style>\n\n</head>'
              html = html.replace(marker, css + marker, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Move hero kicker slightly lower"
            git push
          fi
