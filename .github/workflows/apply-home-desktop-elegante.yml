name: Apply home desktop elegante

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update home layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # Mantieni il logo SVG corretto nell'header
          html = html.replace(
              '<img src="assets/logo-alta-formazione-funeraria.svg">',
              '<img src="assets/logo-alta-formazione-funeraria.svg" alt="Alta Formazione Funeraria">'
          )
          html = html.replace(
              '<img src="assets/logo-alta-formazione-funeraria.png" alt="Alta Formazione Funeraria">',
              '<img src="assets/logo-alta-formazione-funeraria.svg" alt="Alta Formazione Funeraria">'
          )

          refined = '''<style>
  /* Logo ufficiale - inserito senza alterare contenuti home/corsi */
  .topbar{
    background: rgba(3,21,37,.98) !important;
  }

  .nav{
    min-height: 118px !important;
    height: auto !important;
    padding-top: 12px !important;
    padding-bottom: 12px !important;
  }

  .brand{
    gap: 0 !important;
    align-items: center !important;
    flex-shrink: 0 !important;
  }

  .brand small{
    display: none !important;
  }

  .logo.logo-image{
    width: 100px !important;
    height: auto !important;
    background: transparent !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    padding: 0 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    overflow: visible !important;
  }

  .logo.logo-image img{
    width: 100% !important;
    height: auto !important;
    object-fit: contain !important;
    display: block !important;
    margin: 0 auto !important;
    background: transparent !important;
  }

  footer .logo.logo-image,
  .footer-logo{
    width: 245px !important;
    height: 112px !important;
    margin-bottom: 16px !important;
  }

  @media(max-width:980px){
    .nav{
      min-height: 100px !important;
    }

    .logo.logo-image{
      width: 85px !important;
      height: auto !important;
    }
  }

  @media(max-width:620px){
    .nav{
      min-height: 84px !important;
    }

    .logo.logo-image{
      width: 65px !important;
      height: auto !important;
      padding: 0 !important;
    }
  }
</style>
<style>
/* --- HOME HERO DESKTOP REFINEMENT - solo homepage --- */
.hero{
  min-height: 720px !important;
}

.hero .wrap{
  width: min(1260px, 90vw) !important;
  min-height: 720px !important;
  display: grid !important;
  grid-template-columns: minmax(0, 760px) minmax(320px, 390px) !important;
  align-items: center !important;
  justify-content: space-between !important;
  column-gap: clamp(56px, 6vw, 96px) !important;
  padding-top: 96px !important;
  padding-bottom: 96px !important;
}

.hero .wrap > div:first-child{
  max-width: 760px !important;
  padding-left: clamp(42px, 4.5vw, 72px) !important;
  padding-right: 0 !important;
}

.hero-kicker{
  display: inline-block !important;
  margin-top: 0 !important;
  margin-bottom: 24px !important;
  font-size: 12px !important;
  line-height: 1.25 !important;
  letter-spacing: .22em !important;
}

.hero h1{
  max-width: 760px !important;
  font-size: clamp(46px, 4.9vw, 72px) !important;
  line-height: 1.04 !important;
  letter-spacing: -0.02em !important;
}

.hero p{
  max-width: 650px !important;
  margin: 28px 0 0 !important;
  font-size: 18px !important;
  line-height: 1.75 !important;
}

.hero-actions{
  display: flex !important;
  gap: 18px !important;
  flex-wrap: wrap !important;
  margin-top: 42px !important;
  margin-left: 0 !important;
  padding-left: 0 !important;
}

.hero-actions .btn{
  min-width: 210px !important;
  padding-left: 24px !important;
  padding-right: 24px !important;
}

.features{
  justify-self: end !important;
  width: min(390px, 100%) !important;
}

.feature{
  padding: 26px !important;
}

@media(max-width:980px){
  .hero{
    min-height: auto !important;
  }

  .hero .wrap{
    width: min(860px, calc(100% - 56px)) !important;
    min-height: auto !important;
    grid-template-columns: 1fr !important;
    padding-top: 72px !important;
    padding-bottom: 72px !important;
    row-gap: 36px !important;
  }

  .hero .wrap > div:first-child{
    max-width: 760px !important;
    padding-left: 0 !important;
    padding-right: 0 !important;
  }

  .features{
    justify-self: stretch !important;
    width: 100% !important;
  }
}

@media(max-width:620px){
  .hero .wrap{
    width: min(520px, calc(100% - 40px)) !important;
    padding-top: 58px !important;
    padding-bottom: 58px !important;
  }

  .hero-kicker{
    margin-bottom: 18px !important;
    font-size: 11px !important;
    letter-spacing: .18em !important;
  }

  .hero h1{
    font-size: clamp(34px, 11vw, 46px) !important;
  }

  .hero p{
    font-size: 16px !important;
    line-height: 1.65 !important;
    margin-top: 22px !important;
  }

  .hero-actions{
    flex-direction: column !important;
    gap: 12px !important;
    margin-top: 30px !important;
    margin-left: 0 !important;
    padding-left: 0 !important;
  }

  .hero-actions .btn{
    width: 100% !important;
    min-width: 0 !important;
  }
}
</style>

</head>'''

          pattern = r'<style>\s*/\* Logo ufficiale - inserito senza alterare contenuti home/corsi \*/.*?</style>\s*</head>'
          html2 = re.sub(pattern, refined, html, count=1, flags=re.S)
          if html2 == html:
              raise SystemExit('Logo style block not found; no changes applied')

          p.write_text(html2, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply elegant desktop home layout"
            git push
          fi
