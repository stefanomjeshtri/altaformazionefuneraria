name: Patch hero buttons spacing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add breathing room to hero buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          new_css = '''  .hero-actions{
    margin-top: 14px !important;
    padding-left: 12px !important;
  }

  @media(max-width:620px){
    .hero-actions{
      padding-left: 0 !important;
      margin-top: 16px !important;
    }
  }
'''

          if 'padding-left: 12px !important;' in html and '.hero-actions{' in html:
              print('Hero buttons spacing already applied')
          elif '.hero-actions{' in html:
              marker = '</style>\n\n</head>'
              html = html.replace(marker, new_css + marker, 1)
          else:
              marker = '</style>\n\n</head>'
              html = html.replace(marker, new_css + marker, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add spacing to hero buttons"
            git push
          fi
